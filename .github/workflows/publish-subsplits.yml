name: Sub-Split Publishing

on:
    push:
        branches:
            - '[0-9]+.[0-9]+'
    create:
        tags:
            - '*'
    delete:
        tags:
            - '*'

jobs:
    publish_subsplits:
        runs-on: ubuntu-latest
        name: Publish package sub-splits
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: '0'
                  persist-credentials: 'false'

            - uses: frankdejonge/use-github-token@15e6289d07c12b3b1603268a628bb74f2e9765f4 # as 1.1.0
              with:
                  authentication: 'alexander-schranz:${{ secrets.PERSONAL_ACCESS_TOKEN }}'
                  user_name: 'Alexander Schranz'
                  user_email: 'alexander@sulu.io'

            - name: Cache splitsh-lite
              id: splitsh-cache
              uses: actions/cache@v6
              with:
                  path: './.splitsh'
                  key: '${{ runner.os }}-splitsh'

            - uses: frankdejonge/use-subsplit-publish@0001015147267203898034927e8cccad3a7a9aa7 # as 1.1.0
              with:
                  source-branch: '${{ github.ref_name }}'
                  config-path: './config.subsplit-publish.json'
                  splitsh-path: './.splitsh/splitsh-lite'
                  splitsh-version: 'v1.0.1'
