name: Lint

on:
    pull_request_target:
    push:
        branches:
            - '[0-9]+.[0-9]+'

jobs:
    lint:
        name: "Lint"
        runs-on: ubuntu-latest

        steps:
            - name: Output infos
              run: |
                  echo "${{ github.event.pull_request.merge_commit_sha }}"
                  echo "${{ github.event.pull_request.head.sha }}"

            - name: Checkout project
              uses: actions/checkout@v4
              with:
                  ref: "${{ github.event.pull_request.head.sha }}"

            - name: Git infos
              run: |
                  git rev-parse HEAD
                  git branch --show-current

            - name: Install and configure PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'
                  tools: 'composer:v2'
                  ini-values: memory_limit=-1, zend.assertions=1
                  coverage: none

            - name: Determine Composer root version
              id: composer-root-version
              run: |
                  base_ref="${{ github.base_ref }}"
                  if [[ "$base_ref" =~ ^[0-9]+\.[0-9]+$ ]]; then
                      echo "value=${base_ref}.x-dev" >> "$GITHUB_OUTPUT"
                  else
                      echo "value=0.12.x-dev" >> "$GITHUB_OUTPUT"
                  fi

            - name: Install composer dependencies
              uses: ramsey/composer-install@v2
              env:
                  COMPOSER_ROOT_VERSION: "${{ steps.composer-root-version.outputs.value }}"
              with:
                  working-directory: ${{ inputs.directory }}
                  dependency-versions: 'highest'

            - name: Run packages lints
              run: composer lint
