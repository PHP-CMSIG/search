services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      cluster.routing.allocation.disk.threshold_enabled: 'false'
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  meilisearch:
    image: getmeili/meilisearch:v1
    environment:
      MEILI_ENV: development
    ports:
      - "7700:7700"
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail localhost:7700/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - meilisearch-data:/data.ms

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      cluster.routing.allocation.disk.threshold_enabled: 'false'
      DISABLE_SECURITY_PLUGIN: true
      http.port: 9201
    ports:
      - "9201:9201"
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail localhost:9201/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  redis:
    image: redis:8
    ports:
      - 6379:6379
    command: >
      --requirepass supersecure
    volumes:
     - redisearch-data:/data

  redisinsight: # optional for debug and visualize redis data
    image: redis/redisinsight:latest
    ports:
      - 5540:5540 # redis insight: to connect use "redis://default:supersecure@redis:6379"
    depends_on:
      - "redis"

  typesense:
    image: typesense/typesense:29.0
    ports:
      - "8108:8108"
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: S3CR3T
    healthcheck:
      test: ["CMD-SHELL", "exit 0"] # TODO currently not working as curl not available: https://github.com/typesense/typesense/issues/441#issuecomment-1383157680
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - typesense-data:/data
  solr:
    image: "solr:9"
    ports:
      - "8983:8983"
      - "9983:9983"
    command: solr -f -cloud
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail localhost:8983 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      SOLR_OPTS: '-Dsolr.disableConfigSetsCreateAuthChecks=true'
    volumes:
      - solr-data:/var/solr

  zookeeper:
    image: "solr:9"
    depends_on:
      - "solr"
    network_mode: "service:solr"
    environment:
      SOLR_OPTS: '-Dsolr.disableConfigSetsCreateAuthChecks=true'
    command: bash -c "set -x; export; wait-for-solr.sh; solr zk -z localhost:9983 upconfig -n default -d /opt/solr/server/solr/configsets/_default; tail -f /dev/null"

volumes:
  elasticsearch-data:
  meilisearch-data:
  opensearch-data:
  redisearch-data:
  solr-data:
  typesense-data:
